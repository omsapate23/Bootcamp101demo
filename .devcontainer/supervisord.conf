[unix_http_server]
file=%(ENV_HOME)s/.bootcamp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=false
logfile=%(ENV_HOME)s/.bootcamp/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(ENV_HOME)s/.bootcamp/supervisor.pid
childlogdir=%(ENV_HOME)s/.bootcamp
environment=DISPLAY=":1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.bootcamp/supervisor.sock

[program:desktop]
command=/usr/bin/tigervncserver :1 -fg -geometry 1280x800 -depth 24 -localhost yes -SecurityTypes VncAuth -rfbauth %(ENV_HOME)s/.vnc/passwd -xstartup %(ENV_HOME)s/.vnc/bootcamp-xstartup
directory=%(ENV_HOME)s
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.bootcamp/vnc.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
directory=%(ENV_HOME)s
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.bootcamp/novnc.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2