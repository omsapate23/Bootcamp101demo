name: Build, Test & Publish Bootcamp Desktop Image

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - 'tests/**'
      - '.github/workflows/build-desktop-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    name: Build, Verify & Push Desktop Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bootcamp-desktop
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=

      - name: Build Docker Image locally for verification
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          load: true
          tags: bootcamp-desktop:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Automated Smoke & Verification Tests in Container
        run: |
          chmod +x tests/smoke_test.sh
          docker run --rm \
            --user vscode \
            -e DISPLAY=:1 \
            -v "${{ github.workspace }}:/workspaces/Bootcamp101demo" \
            -w /workspaces/Bootcamp101demo \
            bootcamp-desktop:test \
            bash /workspaces/Bootcamp101demo/tests/smoke_test.sh

      - name: Push verified Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
